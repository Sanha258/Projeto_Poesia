<!DOCTYPE html>
<html>
<head>

    <title>Email Card</title>

</head>
<body style="background:#e3eafc;margin:0;padding:0;">
    <div style="max-width:420px;margin:48px auto;padding:0;">
        <div style="background:#0a2540;border-radius:16px;box-shadow:0 6px 24px rgba(10,37,64,0.18);padding:32px 28px 24px 28px;">
            <div style="text-align:center;">
                <div style="width:56px;height:56px;background:#4fc3f7;border-radius:50%;margin:0 auto 18px auto;display:flex;align-items:center;justify-content:center;">

                </div>
                <h1 style="color:#4fc3f7;font-size:2em;margin-bottom:10px;margin-top:0;">Olá,${nome}!</h1>
                <p style="color:#fff;font-size:1.15em;line-height:1.6;margin-bottom:0;">${mensagen}</p>
            </div>
        </div>
    </div>
</body>
</html>
